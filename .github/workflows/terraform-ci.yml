name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive -no-color

      - name: Initialize providers without a backend
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir=infra validate -no-color

      - name: Test environment and VM size constraints
        run: terraform -chdir=infra test -no-color